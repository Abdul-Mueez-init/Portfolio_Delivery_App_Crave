name: crave
description: "Crave — order ahead or book a table at local shops."
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: '>=3.3.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
 
  # Backend
  supabase_flutter: ^2.5.6
 
  # State management
  flutter_riverpod: ^2.5.1
 
  # Routing
  go_router: ^14.2.0
 
  # Fonts (per design.md typography)
  google_fonts: ^6.2.1
 
  # Maps (delivery tracking, Phase 5)
  google_maps_flutter: ^2.7.0
 
  # Real GPS fix for "Use current location" (Phase G — replaces the
  # random-offset simulation in fulfillment_provider.dart)
  geolocator: ^13.0.2
 
  # Reverse geocoding (lat/lng -> real street address) for the GPS
  # branch of "Use current location" — see fulfillment_provider.dart.
  # FIX: was ^3.0.0, whose geocoding_android build was compiled
  # against Android SDK 33 — too old for its own transitive androidx
  # deps (fragment, window, lifecycle-*, etc., which need 34+),
  # causing `checkDebugAarMetadata` to fail the build outright no
  # matter what compileSdk the *app* itself is set to. 5.0.0 (current
  # release) ships a modern geocoding_android build. Note: 5.0.0 also
  # changed the API from top-level functions to a `Geocoding` class
  # instance — see fulfillment_provider.dart's updated usage.
  geocoding: ^5.0.0
 
  # Environment variables
  flutter_dotenv: ^5.1.0
 
  flutter_svg: ^2.0.10
 
  # Image picking for menu item / shop cover uploads (Phase 8)
  image_picker: ^1.1.2
 
  # Caches network images across rebuilds/scroll-back/app restart —
  # Phase H, replaces every Image.network call site
  cached_network_image: ^3.4.1
 
  # Icons
  cupertino_icons: ^1.0.6
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
 
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/