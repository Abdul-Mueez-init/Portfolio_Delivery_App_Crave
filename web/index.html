<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="crave">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>crave</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JS API — required for google_maps_flutter to render on
    web (it doesn't need this on Android/iOS, those use native SDKs).
    Replace YOUR_WEB_MAPS_API_KEY with a browser-restricted key from
    Google Cloud Console (Maps JavaScript API enabled). Do NOT reuse
    your Android/iOS key as-is — create a separate one restricted to
    your Netlify domain, since this key is publicly visible in page
    source on the web (that's normal/expected for Maps JS, but only
    if it's restricted).
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDon_mp5UvBOfuDPg2izkE9LIGdIsmqX90" defer></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
